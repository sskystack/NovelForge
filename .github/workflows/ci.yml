name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --directory apps/api --extra dev --locked
      - run: uv run --directory apps/api pytest
      - run: uv run --directory apps/api ruff check .
      - name: Start API
        run: uv run --directory apps/api uvicorn novelforge.main:app --host 127.0.0.1 --port 8000 > /tmp/novelforge-api.log 2>&1 &
      - name: Check API health
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/novelforge-api.log
          exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - name: Validate and run setup on Unix
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/setup.sh
          ./scripts/setup.sh
      - name: Validate and run setup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw $errors }
          ./scripts/setup.ps1
