openapi: 3.1.0
info:
  title: NovelForge API
  version: 1.0.0
  description: API contract baseline for NovelForge.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Account created; registration does not start a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      security: []
      summary: Create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Logged in; sets HttpOnly session and readable CSRF cookies
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookies cleared
        "403":
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      summary: Get current user
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
  /novels:
    get:
      summary: List novels accessible to current user
      parameters:
        - in: query
          name: include_archived
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Novel list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Novel"
    post:
      summary: Create novel
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovelCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novel"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /novels/{novel_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: Get novel
      responses:
        "200":
          description: Novel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novel"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update novel
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novel"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      summary: Archive a novel without deleting its data
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Novel archived
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /novels/{novel_id}/characters:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List characters in the novel
      parameters:
        - $ref: "#/components/parameters/IncludeNonCanon"
      responses:
        "200":
          description: Characters, canonical only unless requested otherwise
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Character" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      summary: Create a draft character
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterCreate" }
      responses:
        "201":
          description: Character created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/characters/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - $ref: "#/components/parameters/EntityId"
    get:
      summary: Get a character in the novel
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Update a non-canonical character
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterUpdate" }
      responses:
        "200":
          description: Character updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a non-canonical character
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Character deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/locations:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List locations in the novel
      parameters:
        - $ref: "#/components/parameters/IncludeNonCanon"
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      summary: Create a draft location
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationCreate" }
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/locations/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - $ref: "#/components/parameters/EntityId"
    get:
      summary: Get a location in the novel
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Update a non-canonical location
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationUpdate" }
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a non-canonical location
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Location deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/factions:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List factions in the novel
      parameters:
        - $ref: "#/components/parameters/IncludeNonCanon"
      responses:
        "200":
          description: Factions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Faction" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      summary: Create a draft faction
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactionCreate" }
      responses:
        "201":
          description: Faction created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Faction" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/factions/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - $ref: "#/components/parameters/EntityId"
    get:
      summary: Get a faction in the novel
      responses:
        "200":
          description: Faction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Faction" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Update a non-canonical faction
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactionUpdate" }
      responses:
        "200":
          description: Faction updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Faction" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a non-canonical faction
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Faction deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/world-rules:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List world rules in the novel
      parameters:
        - $ref: "#/components/parameters/IncludeNonCanon"
      responses:
        "200":
          description: World rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorldRule" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      summary: Create a draft world rule
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorldRuleCreate" }
      responses:
        "201":
          description: World rule created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldRule" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/world-rules/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - $ref: "#/components/parameters/EntityId"
    get:
      summary: Get a world rule in the novel
      responses:
        "200":
          description: World rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldRule" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Update a non-canonical world rule
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorldRuleUpdate" }
      responses:
        "200":
          description: World rule updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldRule" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a non-canonical world rule
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: World rule deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/events:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List story events ordered by story time
      responses:
        "200":
          description: Story events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoryEvent" }
    post:
      summary: Create a story event draft
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryEventCreate" }
      responses:
        "201":
          description: Story event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryEvent" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/characters/{entity_id}/states:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - $ref: "#/components/parameters/EntityId"
    get:
      summary: List character state history
      responses:
        "200":
          description: State snapshots ordered by story order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CharacterState" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      summary: Add a proposed character state snapshot
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterStateCreate" }
      responses:
        "201":
          description: State snapshot created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterState" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/characters/{entity_id}/state-at:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - $ref: "#/components/parameters/EntityId"
    get:
      summary: Get the approved character state applicable at a story order
      parameters:
        - $ref: "#/components/parameters/StoryOrder"
      responses:
        "200":
          description: Applicable state or null when none is approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterStateAt" }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/character-states:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: Get each character's approved state at a story order
      parameters:
        - $ref: "#/components/parameters/StoryOrder"
      responses:
        "200":
          description: Applicable states ordered by character ID
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CharacterState" }
  /novels/{novel_id}/relationships:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List character relationships
      parameters:
        - $ref: "#/components/parameters/StoryOrderOptional"
        - $ref: "#/components/parameters/IncludeNonCanon"
      responses:
        "200":
          description: Relationships applicable at the optional story order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Relationship" }
    post:
      summary: Create a typed relationship draft
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelationshipCreate" }
      responses:
        "201":
          description: Relationship created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relationship" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/knowledge/search:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: Hybrid search within a novel
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 1000 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Search results with source provenance
  /novels/{novel_id}/outlines:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: Retrieve the nested outline tree
      responses:
        "200":
          description: Outline roots and recursively nested children
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutlineNode" }
    post:
      summary: Create an outline node
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutlineNodeCreate" }
      responses:
        "201":
          description: Outline node created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutlineNode" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/outlines/reorder:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    post:
      summary: Set the complete order of sibling outline nodes
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutlineReorder" }
      responses:
        "200":
          description: Reordered siblings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutlineNode" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/outlines/{node_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - $ref: "#/components/parameters/OutlineNodeId"
    get:
      summary: Get an outline node
      responses:
        "200":
          description: Outline node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutlineNode" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Update or move an outline node
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutlineNodeUpdate" }
      responses:
        "200":
          description: Outline node updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutlineNode" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete an outline subtree and unlink its chapters
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Outline subtree deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/chapters:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List chapter metadata
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: [string, "null"] }
      responses:
        "200":
          description: Chapter page with an opaque next cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChapterPage" }
    post:
      summary: Create chapter metadata
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterCreate" }
      responses:
        "201":
          description: Chapter created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/chapters/{chapter_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - name: chapter_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get chapter metadata
      responses:
        "200":
          description: Chapter
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      summary: Append a chapter version using optimistic concurrency
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterUpdate" }
      responses:
        "200":
          description: Chapter updated and a new immutable version created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete a chapter
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Chapter deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/chapters/{chapter_id}/versions:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - name: chapter_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List immutable chapter versions
      responses:
        "200":
          description: Versions newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChapterVersion" }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/chapters/{chapter_id}/restore/{version_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - name: chapter_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Restore a historical body as a new chapter version
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Restored chapter with incremented ETag
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        "409": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /novels/{novel_id}/ai/generations:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    post:
      summary: Start AI generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationCreate"
      responses:
        "202":
          description: Generation accepted
          content:
            application/json:
              schema:
                type: object
                required: [generation_id, status]
                properties:
                  generation_id: { type: string, format: uuid }
                  status: { type: string, enum: [queued] }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: novelforge_session
  parameters:
    NovelId:
      name: novel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      name: entity_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OutlineNodeId:
      name: node_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncludeNonCanon:
      name: include_non_canon
      in: query
      required: false
      description: Include draft, proposed and deprecated records.
      schema: { type: boolean, default: false }
    StoryOrder:
      name: story_order
      in: query
      required: true
      schema: { type: number, minimum: 0, multipleOf: 0.000001 }
    StoryOrderOptional:
      name: story_order
      in: query
      required: false
      schema: { type: number, minimum: 0, multipleOf: 0.000001 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[0-9]+"$' }
  responses:
    Unauthorized:
      description: Authentication required
    Problem:
      description: Problem Details error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
        display_name: { type: string, maxLength: 120 }
    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    Problem:
      type: object
      required: [type, title, status, detail, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
    Novel:
      type: object
      required: [id, title, language, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        language: { type: string }
        premise: { type: string }
        status: { type: string, enum: [active, archived] }
        genre: { type: array, items: { type: string } }
        writing_preferences: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
    NovelCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        language: { type: string, default: zh-CN }
        genre:
          type: array
          items: { type: string }
        premise: { type: string }
        writing_preferences: { type: object, additionalProperties: true }
    NovelUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        language: { type: string, minLength: 2, maxLength: 32 }
        genre: { type: array, items: { type: string } }
        premise: { type: string, maxLength: 20000 }
        writing_preferences: { type: object, additionalProperties: true }
        status: { type: string, enum: [active, archived] }
    CharacterCreate:
      allOf:
        - $ref: "#/components/schemas/CharacterFields"
        - $ref: "#/components/schemas/CanonCreateStatus"
    CharacterUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        aliases: { type: array, maxItems: 100, items: { type: string } }
        summary: { type: string, maxLength: 20000 }
        personality: { type: object, additionalProperties: true }
        background: { type: string, maxLength: 50000 }
        goals: { type: array, maxItems: 100, items: { type: string } }
        constraints: { type: array, maxItems: 100, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        canon_status: { type: string, enum: [draft, proposed, deprecated] }
    Character:
      allOf:
        - $ref: "#/components/schemas/CanonMetadata"
        - $ref: "#/components/schemas/CharacterFields"
    CharacterFields:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        aliases: { type: array, maxItems: 100, items: { type: string } }
        summary: { type: string, maxLength: 20000 }
        personality: { type: object, additionalProperties: true }
        background: { type: string, maxLength: 50000 }
        goals: { type: array, maxItems: 100, items: { type: string } }
        constraints: { type: array, maxItems: 100, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
    LocationCreate:
      allOf:
        - $ref: "#/components/schemas/LocationFields"
        - $ref: "#/components/schemas/CanonCreateStatus"
    LocationUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 50000 }
        attributes: { type: object, additionalProperties: true }
        canon_status: { type: string, enum: [draft, proposed, deprecated] }
    Location:
      allOf:
        - $ref: "#/components/schemas/CanonMetadata"
        - $ref: "#/components/schemas/LocationFields"
    LocationFields:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 50000 }
        attributes: { type: object, additionalProperties: true }
    FactionCreate:
      allOf:
        - $ref: "#/components/schemas/FactionFields"
        - $ref: "#/components/schemas/CanonCreateStatus"
    FactionUpdate:
      allOf:
        - $ref: "#/components/schemas/LocationUpdate"
    Faction:
      allOf:
        - $ref: "#/components/schemas/CanonMetadata"
        - $ref: "#/components/schemas/FactionFields"
    FactionFields:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 50000 }
        attributes: { type: object, additionalProperties: true }
    WorldRuleCreate:
      allOf:
        - $ref: "#/components/schemas/WorldRuleFields"
        - $ref: "#/components/schemas/CanonCreateStatus"
    WorldRuleUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 50000 }
        constraints: { type: object, additionalProperties: true }
        canon_status: { type: string, enum: [draft, proposed, deprecated] }
    WorldRule:
      allOf:
        - $ref: "#/components/schemas/CanonMetadata"
        - $ref: "#/components/schemas/WorldRuleFields"
    WorldRuleFields:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 50000 }
        constraints: { type: object, additionalProperties: true }
    CanonCreateStatus:
      type: object
      properties:
        canon_status: { type: string, enum: [draft, proposed, deprecated], default: draft }
    CanonMetadata:
      type: object
      required: [id, novel_id, canon_status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        canon_status: { type: string, enum: [draft, proposed, canon, deprecated] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoryEventCreate:
      type: object
      required: [title, story_order]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 50000 }
        story_order: { type: number, minimum: 0, multipleOf: 0.000001 }
        story_time_label: { type: [string, "null"], maxLength: 120 }
        occurred_at: { type: [string, "null"], format: date-time }
        event_type: { type: string, minLength: 1, maxLength: 80, default: general }
        canon_status: { type: string, enum: [draft, proposed, deprecated], default: draft }
    StoryEvent:
      allOf:
        - $ref: "#/components/schemas/StoryEventCreate"
        - type: object
          required: [id, novel_id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            novel_id: { type: string, format: uuid }
            source_chapter_id: { type: [string, "null"], format: uuid }
            occurred_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CharacterStateCreate:
      type: object
      required: [story_order, state]
      properties:
        story_order: { type: number, minimum: 0, multipleOf: 0.000001 }
        valid_to_order: { type: [number, "null"], minimum: 0, multipleOf: 0.000001 }
        state: { type: object, additionalProperties: true }
        source_event_id: { type: [string, "null"], format: uuid }
        canon_status: { type: string, enum: [draft, proposed, deprecated], default: proposed }
    CharacterState:
      allOf:
        - $ref: "#/components/schemas/CharacterStateCreate"
        - type: object
          required: [id, novel_id, character_id, created_at]
          properties:
            id: { type: string, format: uuid }
            novel_id: { type: string, format: uuid }
            character_id: { type: string, format: uuid }
            canon_status: { type: string, enum: [draft, proposed, canon, deprecated] }
            created_at: { type: string, format: date-time }
    CharacterStateAt:
      type: object
      required: [character_id, story_order, state]
      properties:
        character_id: { type: string, format: uuid }
        story_order: { type: number, minimum: 0, multipleOf: 0.000001 }
        state: { oneOf: [{ $ref: "#/components/schemas/CharacterState" }, { type: "null" }] }
    RelationshipCreate:
      type: object
      required: [from_character_id, to_character_id, relationship_type]
      properties:
        from_character_id: { type: string, format: uuid }
        to_character_id: { type: string, format: uuid }
        relationship_type: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 50000 }
        valid_from_order: { type: [number, "null"], minimum: 0, multipleOf: 0.000001 }
        valid_to_order: { type: [number, "null"], minimum: 0, multipleOf: 0.000001 }
        canon_status: { type: string, enum: [draft, proposed, deprecated], default: draft }
        attributes: { type: object, additionalProperties: true }
    Relationship:
      allOf:
        - $ref: "#/components/schemas/RelationshipCreate"
        - type: object
          required: [id, novel_id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            novel_id: { type: string, format: uuid }
            canon_status: { type: string, enum: [draft, proposed, canon, deprecated] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    OutlineNodeCreate:
      type: object
      required: [node_type, title]
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        node_type: { type: string, enum: [book, volume, arc, chapter, scene, beat] }
        title: { type: string, minLength: 1, maxLength: 200 }
        synopsis: { type: string, maxLength: 50000 }
        sort_order: { type: integer, default: 0 }
        planned_start_order: { type: [number, "null"], multipleOf: 0.000001 }
        planned_end_order: { type: [number, "null"], multipleOf: 0.000001 }
        status: { type: string, default: planned }
        linked_entity_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
    OutlineNodeUpdate:
      type: object
      minProperties: 1
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        node_type: { type: string, enum: [book, volume, arc, chapter, scene, beat] }
        title: { type: string, minLength: 1, maxLength: 200 }
        synopsis: { type: string, maxLength: 50000 }
        sort_order: { type: integer }
        planned_start_order: { type: [number, "null"], multipleOf: 0.000001 }
        planned_end_order: { type: [number, "null"], multipleOf: 0.000001 }
        status: { type: string }
        linked_entity_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
    OutlineNode:
      allOf:
        - type: object
          required: [id, novel_id, node_type, title, sort_order, created_at, updated_at, children]
          properties:
            id: { type: string, format: uuid }
            novel_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            children:
              type: array
              items: { $ref: "#/components/schemas/OutlineNode" }
        - $ref: "#/components/schemas/OutlineNodeCreate"
    OutlineReorder:
      type: object
      required: [ordered_node_ids]
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        ordered_node_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
    ChapterCreate:
      type: object
      required: [title]
      properties:
        outline_node_id: { type: [string, "null"], format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        chapter_number: { type: [integer, "null"] }
        story_order: { type: [number, "null"], multipleOf: 0.000001 }
        status: { type: string, enum: [planned, draft, in_progress, review, completed], default: planned }
        summary: { type: string, maxLength: 50000 }
    ChapterUpdate:
      type: object
      minProperties: 1
      properties:
        outline_node_id: { type: [string, "null"], format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        chapter_number: { type: [integer, "null"] }
        story_order: { type: [number, "null"], multipleOf: 0.000001 }
        status: { type: string, enum: [planned, draft, in_progress, review, completed] }
        summary: { type: string, maxLength: 50000 }
        content_format: { type: string, enum: [tiptap, markdown] }
        content: { type: object, additionalProperties: true }
        markdown: { type: string, maxLength: 2000000 }
    Chapter:
      allOf:
        - type: object
          required: [id, novel_id, current_version, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            novel_id: { type: string, format: uuid }
            current_version: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        - $ref: "#/components/schemas/ChapterCreate"
    ChapterPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Chapter" }
        next_cursor: { type: [string, "null"] }
    ChapterVersion:
      type: object
      required: [id, novel_id, chapter_id, version_number, content_format, plain_text, word_count, created_at]
      properties:
        id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        content_format: { type: string, enum: [tiptap, markdown] }
        tiptap_json: { type: [object, "null"], additionalProperties: true }
        markdown: { type: [string, "null"] }
        plain_text: { type: string }
        word_count: { type: integer, minimum: 0 }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    GenerationCreate:
      type: object
      required: [task, instructions]
      properties:
        task:
          type: string
          enum: [draft_chapter, outline, rewrite, critique, summary]
        chapter_id: { type: string, format: uuid }
        instructions: { type: string, maxLength: 10000 }
        model_profile_id: { type: string, format: uuid }
        context_options: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true }
