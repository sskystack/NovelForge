openapi: 3.1.0
info:
  title: NovelForge API
  version: 1.0.0
  description: API contract baseline for NovelForge.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Account created; registration does not start a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      security: []
      summary: Create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Logged in; sets HttpOnly session and readable CSRF cookies
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookies cleared
        "403":
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      summary: Get current user
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
  /novels:
    get:
      summary: List novels accessible to current user
      parameters:
        - in: query
          name: include_archived
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Novel list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Novel"
    post:
      summary: Create novel
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovelCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novel"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /novels/{novel_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: Get novel
      responses:
        "200":
          description: Novel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novel"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update novel
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NovelUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Novel"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      summary: Archive a novel without deleting its data
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Novel archived
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /novels/{novel_id}/characters:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: List characters
      responses:
        "200":
          description: Character list
    post:
      summary: Create character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterCreate"
      responses:
        "201":
          description: Created
  /novels/{novel_id}/knowledge/search:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    get:
      summary: Hybrid search within a novel
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 1000 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Search results with source provenance
  /novels/{novel_id}/ai/generations:
    parameters:
      - $ref: "#/components/parameters/NovelId"
    post:
      summary: Start AI generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationCreate"
      responses:
        "202":
          description: Generation accepted
          content:
            application/json:
              schema:
                type: object
                required: [generation_id, status]
                properties:
                  generation_id: { type: string, format: uuid }
                  status: { type: string, enum: [queued] }
  /novels/{novel_id}/chapters/{chapter_id}:
    parameters:
      - $ref: "#/components/parameters/NovelId"
      - name: chapter_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update chapter using optimistic concurrency
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_format]
              properties:
                title: { type: string }
                content_format: { type: string, enum: [tiptap, markdown] }
                content: { type: object, additionalProperties: true }
                markdown: { type: string }
      responses:
        "200":
          description: New version saved
        "409":
          description: Version conflict
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: novelforge_session
  parameters:
    NovelId:
      name: novel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Authentication required
    Problem:
      description: Problem Details error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
        display_name: { type: string, maxLength: 120 }
    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    Problem:
      type: object
      required: [type, title, status, detail, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
    Novel:
      type: object
      required: [id, title, language, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        language: { type: string }
        premise: { type: string }
        status: { type: string, enum: [active, archived] }
        genre: { type: array, items: { type: string } }
        writing_preferences: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
    NovelCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        language: { type: string, default: zh-CN }
        genre:
          type: array
          items: { type: string }
        premise: { type: string }
        writing_preferences: { type: object, additionalProperties: true }
    NovelUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        language: { type: string, minLength: 2, maxLength: 32 }
        genre: { type: array, items: { type: string } }
        premise: { type: string, maxLength: 20000 }
        writing_preferences: { type: object, additionalProperties: true }
        status: { type: string, enum: [active, archived] }
    CharacterCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string }
        personality: { type: object, additionalProperties: true }
        background: { type: string }
        goals: { type: array, items: { type: string } }
        constraints: { type: array, items: { type: string } }
    GenerationCreate:
      type: object
      required: [task, instructions]
      properties:
        task:
          type: string
          enum: [draft_chapter, outline, rewrite, critique, summary]
        chapter_id: { type: string, format: uuid }
        instructions: { type: string, maxLength: 10000 }
        model_profile_id: { type: string, format: uuid }
        context_options: { type: object, additionalProperties: true }
        output: { type: object, additionalProperties: true }
